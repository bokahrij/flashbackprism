name: Build Android Apk 5

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      android_api:
        description: 'Android API level'
        required: true
        default: '33'
      android_ndk:
        description: 'Android NDK version'
        required: true
        default: '25.2.9519653'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # what we actually want to install
      QT_VERSION: "6.6.0"
      BUILD_TOOLS: "33.0.2"          # e.g. 33.0.2 for API 33

    steps:
      # -------------------------------- 1️⃣  Checkout --------------------------------
      - uses: actions/checkout@v4

      # -------------------------------- 2️⃣  Setup Python --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # -------------------------------- 3️⃣  Install aqtinstall --------------------------------
      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip aqtinstall

      # -------------------------------- 4️⃣  Find latest Qt Android version --------------------------------
      - name: Find latest Qt Android version
        id: listqt
        run: |
          # grab the first column only (the version)
          LATEST=$(python -m aqt list-qt linux android | grep '^6\.' | sort -Vr | head -n1 | awk '{print $1}')
          echo "latest_android_qt=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest Qt for Android: $LATEST"

      # -------------------------------- 5️⃣  Install Qt Android --------------------------------
      - name: Install Qt Android
        run: |
          python -m aqt install-qt linux android ${{ steps.listqt.outputs.latest_android_qt }} android_arm64_v8a \
            --outputdir $HOME/Qt \
            --modules qtbase,qtdeclarative,qtquickcontrols2

      # -------------------------------- 6️⃣  Install Android SDK & NDK --------------------------------
      - name: Install Android SDK & NDK
        run: |
          # The runner already has openjdk‑17, but we install a small JDK just to be safe.
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip

          SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          mv cmdline-tools latest
          mv latest cmdline-tools/

          # make sdkmanager available to all subsequent steps
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ github.event.inputs.android_api }}" \
            "build-tools;${{ env.BUILD_TOOLS }}" \
            "ndk;${{ github.event.inputs.android_ndk }}"

      # -------------------------------- 7️⃣  Configure Build --------------------------------
      - name: Configure Build
        run: |
          mkdir -p android-build
          cd android-build
          $HOME/Qt/${{ steps.listqt.outputs.latest_android_qt }}/android_arm64_v8a/bin/qt-cmake .. \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/${{ github.event.inputs.android_ndk }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ github.event.inputs.android_api }} \
            -DQt6_DIR=$HOME/Qt/${{ steps.listqt.outputs.latest_android_qt }}/android_arm64_v8a/lib/cmake/Qt6 \
            -DCMAKE_PREFIX_PATH=$HOME/Qt/${{ steps.listqt.outputs.latest_android_qt }}/android_arm64_v8a/lib/cmake \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY

      # -------------------------------- 8️⃣  Compile --------------------------------
      - name: Compile
        run: |
          cd android-build
          cmake --build . --parallel --target android_package

      # -------------------------------- 9️⃣  Deploy APK --------------------------------
      - name: Deploy APK
        run: |
          cd android-build
          BUILD_TYPE=${{ github.event.inputs.build_type }}
          $HOME/Qt/${{ steps.listqt.outputs.latest_android_qt }}/android_arm64_v8a/bin/androiddeployqt \
            --input android-libflashbackprism.so-deployment-settings.json \
            --output android-apk \
            --$BUILD_TYPE \
            --sign

      # -------------------------------- 🔟  Upload Artifact --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashbackPrism-APK
          path: android-build/android-apk/*.apk
