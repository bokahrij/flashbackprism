name: Build Android APK 4

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      android_api:
        description: 'Android API Level'
        required: true
        default: '33'
      android_ndk:
        description: 'Android NDK version'
        required: true
        default: '25.2.9519653'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------- 1️⃣  Checkout --------------------------------
      - uses: actions/checkout@v4

      # -------------------------------- 2️⃣  Setup Python --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      # -------------------------------- 3️⃣  Install aqtinstall --------------------------------
      - name: Install aqtinstall
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade aqtinstall

      # -------------------------------- 4️⃣  Find latest Qt Android version --------------------------------
      - name: Find latest Qt Android version
        id: listqt
        run: |
          AVAILABLE=$(python3 -m aqt list-qt linux android | tr ' ' '\n' | grep '^6\.' | sort -Vr | head -n1)
          echo "latest_android_qt=$AVAILABLE" >> $GITHUB_OUTPUT
          echo "Latest Qt for Android: $AVAILABLE"

      # -------------------------------- 5️⃣  Install Qt Android --------------------------------
      - name: Install Qt Android
        run: |
          python3 -m aqt install-qt \
            linux android \
            ${{ steps.listqt.outputs.latest_android_qt }} \
            android_arm64_v8a \
            --outputdir $HOME/Qt

      # -------------------------------- 6️⃣  Install Android SDK & NDK --------------------------------
      - name: Install Android SDK & NDK
        run: |
          sudo apt update
          sudo apt install -y openjdk-11-jdk wget unzip

          # Create SDK root and download command‑line tools
          SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          mv cmdline-tools latest
          mv latest cmdline-tools/      # create the required “latest” folder

          # Make the SDK available to every step
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Accept licences
          yes | sdkmanager --licenses

          # Install the packages we need
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ github.event.inputs.android_api }}" \
            "build-tools;${{ github.event.inputs.android_api }}.0.2" \
            "ndk;${{ github.event.inputs.android_ndk }}"

      # -------------------------------- 7️⃣  Configure Build --------------------------------
      - name: Configure Build
        run: |
          mkdir -p android-build
          cd android-build
          $HOME/Qt/${{ steps.listqt.outputs.latest_android_qt }}/android_arm64_v8a/bin/qt-cmake ..

      # -------------------------------- 8️⃣  Compile --------------------------------
      - name: Compile
        run: |
          cd android-build
          make -j$(nproc)

      # -------------------------------- 9️⃣  Deploy APK --------------------------------
      - name: Deploy APK
        run: |
          cd android-build
          BUILD_TYPE=$(echo "${{ github.event.inputs.build_type }}" | tr '[:upper:]' '[:lower:]')
          $HOME/Qt/${{ steps.listqt.outputs.latest_android_qt }}/android_arm64_v8a/bin/androiddeployqt \
            --input android-libflashbackprism.so-deployment-settings.json \
            --output android-apk \
            --$BUILD_TYPE \
            --sign

      # -------------------------------- 🔟  Upload Artifact --------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlashbackPrism-APK
          path: android-build/android-apk/*.apk
